[General]
repeat = 1
**.arpType = "GlobalARP"
*.host*.numUdpApps = 1
*.host*.udpApp[0].remotePort = 10000
*.host*.udpApp[0].localPort = 10000

### ENERGY STORAGE MODEL ###
*.host*.energyStorageType = "IdealEnergyStorage"

### POWER CONSUMPTION MODELS ###
**.energyConsumerType = "StateBasedEnergyConsumer"
### 1. CONSUMPTION MODEL BY DEFAULT ###
# by default, the StateBasedEnergyConsumer models have the settings as follows:
#*.host*.wlan[0].radio.energyConsumer.offPowerConsumption = 0mW
#*.host*.wlan[0].radio.energyConsumer.sleepPowerConsumption = 1mW
#*.host*.wlan[0].radio.energyConsumer.switchingPowerConsumption = 1mW
#*.host*.wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 2mW
#*.host*.wlan[0].radio.energyConsumer.receiverBusyPowerConsumption = 5mW
#*.host*.wlan[0].radio.energyConsumer.receiverReceivingPowerConsumption = 10mW
#*.host*.wlan[0].radio.energyConsumer.transmitterIdlePowerConsumption = 2mW
#*.host*.wlan[0].radio.energyConsumer.transmitterTransmittingPowerConsumption = 100mW
### Consuption model used in ICDCS paper ###
# in this configuration, transmission and reception mode has the same cost and the
# configuration by default to consume less energy is turned off
#*.host*.wlan[0].radio.energyConsumer.offPowerConsumption = 0.0000576mW
#*.host*.wlan[0].radio.energyConsumer.sleepPowerConsumption = 0.000648mW
#*.host*.wlan[0].radio.energyConsumer.switchingPowerConsumption = 0mW
#*.host*.wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 0mW
##*.host*.wlan[0].radio.energyConsumer.receiverBusyPowerConsumption = 244.8mW
#*.host*.wlan[0].radio.energyConsumer.receiverReceivingPowerConsumption = 20mW #295.2mW
#*.host*.wlan[0].radio.energyConsumer.transmitterIdlePowerConsumption = 0mW
#*.host*.wlan[0].radio.energyConsumer.transmitterTransmittingPowerConsumption = 1206mW

### Network layer set up ###
# this lovely and unknown line is the one enabling broadcast in IPv4. We need
# this feature in order to simulate sending simultaneously to many nodes in
# wireless networks
*.host*.networkLayer.ip.forceBroadcast = true
# 1. Ideal MAC layer, the probability of having dropped packages is higher
#*.host*.wlan[*].typename = "IdealWirelessNic"
#*.host*.wlan[*].radioType = "IdealRadio"
# 2. MAC layer with CSMA to cope with collisions
*.host*.wlan[0].typename = "WirelessNic"
*.host*.wlan[*].macType = "CSMA"
*.host*.wlan[*].mac.macMaxFrameRetries = 2
*.host*.wlan[*].mac.useMACAcks = true
*.host*.wlan[*].radio.receiver.ignoreInterference = true
# 3. MAC layer with 802.11g
#*.host*.wlan[0].typename = "WirelessNic"
#*.host*.wlan[0].radioType = "IdealRadio"
#*.host*.wlan[*].macType = "CsmaCaMac"
#*.host*.wlan[*].mac.useAck = true
#*.host*.wlan[*].mac.slotTime = 30us
#*.host*.wlan[*].mac.retryLimit = 3
#*.host*.wlan[*].typename = "Ieee80211Nic"
#*.host*.wlan[*].mgmtType = "Ieee80211MgmtAdhoc"
#*.host*.wlan[*].mgmt.frameCapacity = 10
#*.host*.wlan[*].mac.address = "auto"
#*.host*.wlan[*].mac.basicBitrate = 6Mbps
#*.host*.wlan[*].mac.controlBitrate = 6Mbps
#*.host*.wlan[*].mac.maxQueueSize = 14
#*.host*.wlan[*].mac.rtsThresholdBytes = 3000B
#*.host*.wlan[*].mac.retryLimit = 7
#*.host*.wlan[*].mac.cwMinData = 7
#*.host*.wlan[*].mac.cwMinBroadcast = 31

### TRANSCEIVER ###
*.host*.wlan[0].radioType = "IdealRadio"

### MOBILITY ###
*.host*.mobilityType = "StoredMobility"

### APPLICATION SET UP ###
[Config CONFIGURATION_NAME]
**.bitrate = 1Mbps
network=built_topologies.TOPOLOGY_NAME
sim-time-limit = SIMULATION_TIME
*.host*.udpApp[0].typename = "FullyAdaptive"
*.host*.udpApp[0].protocolsConfig = xmldoc("../../experiments/configs/in_common/config.xml")
*.host*.wlan[*].radio.transmitter.maxCommunicationRange = NODES_TRANSMISSION_RANGE

## SOURCE NODE ##
  *.SOURCE_NODE_ID.udpApp[0].is_source = true
## SOURCE NODE [END] ##

## COMM AREA SET UP ##
  *.host*.udpApp[0].centerDensAx = CENTER_POS_X
  *.host*.udpApp[0].centerDensAy = CENTER_POS_Y
  *.host*.udpApp[0].denseAreaWid = DENSE_REGION_WIDTH
## COMM AREA SET UP [END] ##

## BROADCAST MESSAGES FREQUENCY ##
  *.host*.udpApp[0].wakeUpTime = WARMUP_PHASE
  *.host*.udpApp[0].deltaApprox = 0.3s
  *.host*.udpApp[0].nr_broadcast_msg = BROADCAST_MSGS_NO
  *.host*.udpApp[0].intervalBroadcastTime = BROADCAST_MSG_INTERVAL
## BROADCAST MESSAGES FREQUENCY [END] ##

## ADAPTATION SET UP ##
  *.host*.udpApp[0].withAdaptation=WITH_ADAPTATION
  *.host*.udpApp[0].adaptation_policy = ADAPTATION_POLICY
## ADAPTATION SET UP [END] ##

## MOBILITY SET UP ##
  *.host*.mobility.isMoving = WITH_MOBILITY
  *.host*.mobility.filename = "../../experiments/networks/built_topologies/TOPOLOGY_NAME.mobility"
## MOBILITY SET UP [END] ##

### APPLICATION SET UP [END] ###
