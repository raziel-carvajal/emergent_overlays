[General]
repeat = 1
# status
**.hasStatus = true
# this lovely and unknown line is the one enabling broadcast in IPv4. We need
# this feature in order to simulate sending simultaneously to many nodes in
# wireless networks
**.networkLayer.ip.forceBroadcast = true
# initial energy
**.energyStorage.nominalCapacity = 100.0J
**.energyStorage.nodeShutdownCapacity = 0J
**.energyStorage.initialCapacity = this.nominalCapacity
# just one application running
*.host*.numUdpApps = 1
sim-time-limit = SIMULATION_TIME
# application set up
[Config CONFIGURATION_NAME]
network=built_topologies.TOPOLOGY_NAME

**.udpApp[0].typename="InteroperableBroadcast"
# record only vectors from our application
#	*.host*.{a-t}*.**.vector-recording = false
#	*.host*.{v-z}*.**.vector-recording = false
#	*.host*.udp.**.vector-recording = false

**.wlan[*].radio.receiver.ignoreInterference = true
**.wlan[*].radio.transmitter.maxCommunicationRange = NODES_TRANSMISSION_RANGE

**.udpApp[0].startTime = 0s
**.udpApp[0].stopTime = SIMULATION_TIME

**.udpApp[0].broadcastInterval = BROADCAST_MSG_INTERVAL

# source node
  *.SOURCE_NODE_ID.udpApp[0].isSourceNode = true
# communication area set up
#  centerDensAx = CENTER_POS_X
#  centerDensAy = CENTER_POS_Y
#  denseAreaWid = DENSE_REGION_WIDTH
#  denseAreaLen = DENSE_REGION_LENGTH
#  firstAtDense = FIRST_NODE_AT_DENSE_AREA
# adaptation set up
  **.udpApp[0].adaptationPolicy = ADAPTATION_POLICY
