[General]


**.queueingTime.vector-recording = false
**.queueLength.vector-recording = false
**.wlan[*].*.vector-recording = false
**.wlan[*].queue.*.vector-recording = false
**.wlan[*].mac.*.vector-recording = false
**.wlan[*].radio.*.vector-recording = false # change this one to record the radio modes
**.udp.*.vector-recording = false
**.lo0.lo.*.vector-recording = false
**.energyStorage.powerConsumption.vector-recording = false

**.arpType = "GlobalARP"
*.host*.mobilityType = "LinearMobility"
# this lovely and unknown line is the one enabling broadcast in IPv4. We need this feature in order to simulate sending simultaneously to many nodes in wireless networks
*.host*.networkLayer.ip.forceBroadcast = true

# Set up a model for the energy consumption of the nodes
**.energyConsumerType = "StateBasedEnergyConsumer"
*.host*.wlan[0].radio.energyConsumer.offPowerConsumption = 0mW
*.host*.wlan[0].radio.energyConsumer.sleepPowerConsumption = 1mW
*.host*.wlan[0].radio.energyConsumer.switchingPowerConsumption = 1mW
*.host*.wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 2mW
*.host*.wlan[0].radio.energyConsumer.receiverBusyPowerConsumption = 5mW
*.host*.wlan[0].radio.energyConsumer.receiverReceivingPowerConsumption = 10mW
*.host*.wlan[0].radio.energyConsumer transmitterIdlePowerConsumption = 2mW
*.host*.wlan[0].radio.energyConsumer.transmitterTransmittingPowerConsumption = 350mW


*.host*.energyStorageType = "IdealEnergyStorage"

*.host*.wlan[*].typename = "IdealWirelessNic"
*.host*.wlan[*].radioType = "IdealRadio"

**.bitrate = 1Mbps

*.host*.wlan[*].radio.receiver.ignoreInterference = true

*.host*.numUdpApps = 1
*.host*.udpApp[0].remotePort = 10000
*.host*.udpApp[0].localPort = 10000

# who is the source
*.host*.udpApp[0].intervalBroadcastTime = 0.2s

# communication range is shared
*.host*.wlan[*].radio.transmitter.maxCommunicationRange = 75m

# broadcasting stuff, this will only be used by the source
*.host*.udpApp[0].nr_broadcast_msg = 200
*.host*.udpApp[0].wakeUpTime = 25s

repeat=1
# simulation time
sim-time-limit =  80s
