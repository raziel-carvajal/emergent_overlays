[General]

# move to -15 to represent FS (I don't know what is that)
simtime-scale=-12
# *.host*.mobility.cmdenv-log-level = trace

### REDUCE THE DATASET SIZE BY AVOIDING LOGGING ###
**.queueingTime.vector-recording = false
**.queueLength.vector-recording = false
**.wlan[*].*.vector-recording = false
**.wlan[*].queue.*.vector-recording = false
**.wlan[*].mac.*.vector-recording = false
# CHANGE HERE to record the radio modes
**.wlan[*].radio.*.vector-recording = false
**.udp.*.vector-recording = false
**.lo0.lo.*.vector-recording = false
**.energyStorage.powerConsumption.vector-recording = false
# do not save event number
# INFO: the number of events is required to compute the distribution of battery consumption
#**.vector-record-eventnumbers = false
# **.*.output-vector-precision = 10


### MOBILITY ###
#*.host*.mobilityType = "LinearMobility"
#*.host*.mobility.speed = 0.0mps
#*.host*.mobility.acceleration = 0.0
*.host*.mobilityType = "StoredMobility"
# TODO: our experiments are performed with and without mobility, probably
# this parameter must be altered by the script that launches each configuration
*.host*.mobility.isMoving = false

### POWER CONSUMPTION MODELS ###
**.energyConsumerType = "StateBasedEnergyConsumer"
# WATCH OUT: just one of the following configurations must be set per experiment

### 1. CONSUMPTION MODEL BY DEFAULT ###
# by default, the StateBasedEnergyConsumer models have the settings as follows:

#*.host*.wlan[0].radio.energyConsumer.offPowerConsumption = 0mW
