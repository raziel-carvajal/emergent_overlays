[General]
**.arpType = "GlobalARP"
*.host*.mobilityType = "LinearMobility"
# this lovely and unknown line is the one enabling broadcast in IPv4. We need this feature in order to simulate sending simultaneously to many nodes in wireless networks
*.host*.networkLayer.ip.forceBroadcast = true

# Set up a model for the energy consumption of the nodes
**.energyConsumerType = "StateBasedEnergyConsumer"
*.host*.wlan[0].radio.energyConsumer.offPowerConsumption = 0mW
*.host*.wlan[0].radio.energyConsumer.sleepPowerConsumption = 0mW
*.host*.wlan[0].radio.energyConsumer.switchingPowerConsumption = 0mW
*.host*.wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 0mW
*.host*.wlan[0].radio.energyConsumer.receiverBusyPowerConsumption = 0mW
*.host*.wlan[0].radio.energyConsumer.receiverReceivingPowerConsumption = 50mW
*.host*.wlan[0].radio.energyConsumer transmitterIdlePowerConsumption = 0mW
*.host*.wlan[0].radio.energyConsumer.transmitterTransmittingPowerConsumption = 50mW


*.host*.energyStorageType = "IdealEnergyStorage"

*.host*.wlan[*].typename = "IdealWirelessNic"
*.host*.wlan[*].radioType = "IdealRadio"

**.bitrate = 1Mbps

*.host*.wlan[*].radio.receiver.ignoreInterference = true

*.host*.numUdpApps = 1
*.host*.udpApp[0].remotePort = 10000
*.host*.udpApp[0].localPort = 10000

# who is the source
*.host*.udpApp[0].intervalBroadcastTime = 1.3s

# communication range is shared
*.host*.wlan[*].radio.transmitter.maxCommunicationRange = 75m

# battery capacity
*.host*.energyStorage.nominalCapacity = 50J

# broadcasting stuff, this will only be used by the source
*.host*.udpApp[0].nr_broadcast_msg = 200
*.host*.udpApp[0].wakeUpTime = 5s
repeat=1
# simulation time
sim-time-limit =  400s
