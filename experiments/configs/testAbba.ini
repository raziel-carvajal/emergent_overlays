[General]
**.arpType = "GlobalARP"
# Set up a model for the energy consumption of the nodes
**.energyConsumerType = "StateBasedEnergyConsumer"
#**.energyConsumer.offPowerConsumption = 0mW
**.energyConsumer.receiverReceivingPowerConsumption = 40mW
**.energyConsumer.receiverIdlePowerConsumption = 0mW
**.energyConsumer.receiverBusyPowerConsumption = 0mW
#**.energyConsumer.receiverSynchronizingPowerConsumption = 0mW
**.energyConsumer.sleepPowerConsumption = 0mW
**.energyConsumer.switchingPowerConsumption = 0mW
**.energyConsumer.transmitterIdlePowerConsumption = 0mW
**.energyConsumer.transmitterTransmittingPowerConsumption = 40mW

**.bitrate = 1Mbps

*.host*.udpApp[0].intervalBroadcastTime = 3s

# simulation time
sim-time-limit =  15s

##
*.host*.energyStorageType = "SimpleEnergyStorage"

*.host*.wlan[*].typename = "IdealWirelessNic"
*.host*.wlan[*].radioType = "EnergyAwareIdealRadio"
*.host*.mobilityType = "LinearMobility"

# this lovely and unknown line is the one enabling broadcast in IPv4. We need this feature in order to simulate sending simultaneasly to many nodes in wireless networks
*.host*.networkLayer.ip.forceBroadcast = true


*.host*.wlan[*].radio.receiver.ignoreInterference = true
*.host*.numUdpApps = 1
##
[Config testAbba]
description = "Broadcasting messages using Abba2"
network = testCds
*.host*.wlan[*].radio.transmitter.maxCommunicationRange = 75m
repeat=1

*.host*.udpApp[0].typename = "Abba2"
*.hostR0.udpApp[0].is_source = true
*.hostR0.udpApp[0].nr_broadcast_msg = 1
*.hostR0.udpApp[0].wakeUpTime = 5s

*.host*.energyStorage.nominalCapacity = 50J


*.host*.udpApp[0].nr_hello_messages = 0
*.host*.udpApp[0].maximumDelay = 0.2s
*.host*.udpApp[0].helloTime = 0

*.hostR0.wlan[*].radio.transmitter.maxCommunicationRange = 70m
*.hostR2.wlan[*].radio.transmitter.maxCommunicationRange = 40m
*.hostR3.wlan[*].radio.transmitter.maxCommunicationRange = 45m
*.hostR4.wlan[*].radio.transmitter.maxCommunicationRange = 40m
*.hostR5.wlan[*].radio.transmitter.maxCommunicationRange = 75m
*.hostR6.wlan[*].radio.transmitter.maxCommunicationRange = 85m
*.hostR7.wlan[*].radio.transmitter.maxCommunicationRange = 40m
*.hostR8.wlan[*].radio.transmitter.maxCommunicationRange = 40m
*.hostR9.wlan[*].radio.transmitter.maxCommunicationRange = 40m
*.hostR10.wlan[*].radio.transmitter.maxCommunicationRange = 60m
*.hostR11.wlan[*].radio.transmitter.maxCommunicationRange = 70m
*.hostR13.wlan[*].radio.transmitter.maxCommunicationRange = 50m
*.hostR14.wlan[*].radio.transmitter.maxCommunicationRange = 50m
*.hostR15.wlan[*].radio.transmitter.maxCommunicationRange = 50m
*.hostR16.wlan[*].radio.transmitter.maxCommunicationRange = 50m
