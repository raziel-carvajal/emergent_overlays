[General]
**.arpType = "GlobalARP"
###
*.host*.energyStorageType = "IdealEnergyStorage"
###
*.host*.wlan[0].radio.energyConsumerType = "StateBasedEnergyConsumer"

*.host*.wlan[*].radio.receiver.ignoreInterference = true
###
*.host*.mobilityType = "LinearMobility"
###
# this lovely and unknown line is the one enabling broadcast in IPv4.
#We need this feature in order to simulate sending simultaneasly to
#many nodes in wireless networks
*.host*.networkLayer.ip.forceBroadcast = true
###
*.host*.wlan[0].typename = "WirelessNic"
*.host*.wlan[0].radioType = "IdealRadio"
*.host*.wlan[*].macType = "CSMA"
*.host*.wlan[*].mac.useMACAcks = true
###
*.host*.numUdpApps = 1
**.bitrate = 1Mbps
###
sim-time-limit =  15s
repeat=1
###
[Config n_15_d_medium_CDSpaperTestCDS]
description = "Broadcasting messages using CDS"
network = CDSpaper
*.host*.udpApp[0].typename = "Cds_3"
*.host*.udpApp[0].intervalBroadcastTime = 3s
*.hostR0.udpApp[0].is_source = true
*.hostR0.udpApp[0].nr_broadcast_msg = 3
*.hostR0.udpApp[0].wakeUpTime = 6s
*.host*.udpApp[0].nr_hello_messages = 10
*.host*.udpApp[0].helloTime = 0.2s

*.hostR0.wlan[*].radio.transmitter.maxCommunicationRange = 70m
*.hostR2.wlan[*].radio.transmitter.maxCommunicationRange = 40m
*.hostR3.wlan[*].radio.transmitter.maxCommunicationRange = 45m
*.hostR4.wlan[*].radio.transmitter.maxCommunicationRange = 40m
*.hostR5.wlan[*].radio.transmitter.maxCommunicationRange = 75m
*.hostR6.wlan[*].radio.transmitter.maxCommunicationRange = 85m
*.hostR7.wlan[*].radio.transmitter.maxCommunicationRange = 40m
*.hostR8.wlan[*].radio.transmitter.maxCommunicationRange = 40m
*.hostR9.wlan[*].radio.transmitter.maxCommunicationRange = 40m
*.hostR10.wlan[*].radio.transmitter.maxCommunicationRange = 60m
*.hostR11.wlan[*].radio.transmitter.maxCommunicationRange = 70m
*.hostR13.wlan[*].radio.transmitter.maxCommunicationRange = 50m
*.hostR14.wlan[*].radio.transmitter.maxCommunicationRange = 50m
*.hostR15.wlan[*].radio.transmitter.maxCommunicationRange = 50m
*.hostR16.wlan[*].radio.transmitter.maxCommunicationRange = 50m
