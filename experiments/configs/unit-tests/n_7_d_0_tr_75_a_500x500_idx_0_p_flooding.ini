[General]
repeat = 1
# status
**.hasStatus = true
# this lovely and unknown line is the one enabling broadcast in IPv4. We need
# this feature in order to simulate sending simultaneously to many nodes in
# wireless networks
**.networkLayer.ip.forceBroadcast = true
# initial energy
**.energyStorage.nominalCapacity = 100.0J
**.energyStorage.nodeShutdownCapacity = 0J
**.energyStorage.initialCapacity = this.nominalCapacity
# just one application running
*.host*.numUdpApps = 1
# mobility model
*.host*.mobilityType = "StoredMobility"
#
sim-time-limit = 4s

[Config n_7_d_0_tr_75_a_500x500_idx_0_p_flooding]

network = unit_test.n_7_d_0_tr_75_a_500x500_idx_0_p_

**.wlan[*].radio.receiver.ignoreInterference = true
**.wlan[*].radio.transmitter.maxCommunicationRange = 75m

**.udpApp[0].startTime = 0s
**.udpApp[0].stopTime = 3s

**.udpApp[0].sendInterval = uniform(.50s, .60s)
**.udpApp[0].ctrlMsgInterval = uniform(5.90s, 6.00s)

# source node
  *.host2.udpApp[0].isSource = true
# message length
  **.udpApp[0].messageLength = 200B
# communication area set up
  **.udpApp[0].centerDensAx = 25.0
  **.udpApp[0].centerDensAy = 25.0
  **.udpApp[0].denseAreaWid = 28.284
# adaptation set up
  **.udpApp[0].withAdaptation = false
  **.udpApp[0].adaptationPolicy = 0
# mobility model
  **.mobility.isMoving = false
  **.mobility.filename = "../../experiments/networks/built_topologies/n_393_d_0_tr_6_a_50x50_idx_0_p_.mobility"

**.udpApp[0].typename="PureFlooding"

