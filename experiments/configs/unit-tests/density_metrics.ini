[General]
repeat = 1
# status
**.hasStatus = true
# this lovely and unknown line is the one enabling broadcast in IPv4. We need
# this feature in order to simulate sending simultaneously to many nodes in
# wireless networks
**.networkLayer.ip.forceBroadcast = true
# initial energy
**.energyStorage.nominalCapacity = 100.0J
**.energyStorage.nodeShutdownCapacity = 0J
**.energyStorage.initialCapacity = this.nominalCapacity
# just one application running
*.host*.numUdpApps = 1
sim-time-limit = 2s
# application set up
[Config density_metrics]

network=built_topologies.n_201_d_0_tr_2_a_20x20_idx_0_p_

**.wlan[*].radio.receiver.ignoreInterference = true
**.wlan[*].radio.transmitter.maxCommunicationRange = 2m

**.udpApp[0].typename="DensityCoefficients"
**.udpApp[0].messageLength = 200B
**.udpApp[0].startTime = 0s
**.udpApp[0].stopTime = 2.0s
**.udpApp[0].sendInterval = 1.0s
**.udpApp[0].maxNodesNo = 201

*.host*.mobilityType = "BonnMotionMobility"
*.host*.mobility.traceFile = "../../experiments/networks/built_topologies/n_201_d_0_tr_2_a_20x20_idx_0_p_.mobility"
