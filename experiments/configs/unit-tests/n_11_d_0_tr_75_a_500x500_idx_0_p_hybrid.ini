[General]
**.arpType = "GlobalARP"
###
*.host*.energyStorageType = "IdealEnergyStorage"
###
*.host*.wlan[0].radio.energyConsumerType = "StateBasedEnergyConsumer"
*.host*.wlan[*].radio.receiver.ignoreInterference = true
###
*.host*.mobilityType = "LinearMobility"
*.host*.mobility.isMoving = false
###
# this lovely and unknown line is the one enabling broadcast in IPv4.
#We need this feature in order to simulate sending simultaneasly to
#many nodes in wireless networks
*.host*.networkLayer.ip.forceBroadcast = true
###
*.host*.wlan[0].typename = "WirelessNic"
*.host*.wlan[0].radioType = "IdealRadio"
*.host*.wlan[*].macType = "CSMA"
*.host*.wlan[*].mac.useMACAcks = true
###
*.host*.numUdpApps = 1
**.bitrate = 1Mbps
###
sim-time-limit = 20s

[Config n_11_d_0_tr_75_a_500x500_idx_0_p_hybrid]
network = unit_test.n_11_d_0_tr_75_a_500x500_idx_0_p_

*.host*.udpApp[0].typename = "FullyAdaptive"
*.host*.udpApp[0].protocolsConfig = xmldoc("../../experiments/configs/in_common/config.xml")
#*.host*.mobility.filename = "n_11_d_0_tr_15_a_50x50_idx_0_p_.mobility"
*.host*.wlan[*].radio.transmitter.maxCommunicationRange = 75m

## SOURCE NODE ##
  *.hostR1.udpApp[0].is_source = true
## SOURCE NODE [END] ##

## COMM AREA SET UP ##
  *.host*.udpApp[0].centerDensAx = 250
  *.host*.udpApp[0].centerDensAy = 250
  *.host*.udpApp[0].denseAreaWid = 100
## COMM AREA SET UP [END] ##

## BROADCAST MESSAGES FREQUENCY ##
  *.host*.udpApp[0].wakeUpTime = 3.0s
  *.host*.udpApp[0].deltaApprox = 0.3s
  *.host*.udpApp[0].nr_broadcast_msg = 2
  *.host*.udpApp[0].intervalBroadcastTime = 6.0s
## BROADCAST MESSAGES FREQUENCY [END] ##

### APPLICATION SET UP [END] ###
*.hostR1.udpApp[0].initialProtocol = "Mpr_t2"
*.hostR2.udpApp[0].initialProtocol = "Mpr_t2"
*.hostR3.udpApp[0].initialProtocol = "Mpr_t2"
*.hostR4.udpApp[0].initialProtocol = "Mpr_t2"
*.hostR5.udpApp[0].initialProtocol = "Mpr_t2"
*.hostR6.udpApp[0].initialProtocol = "Mpr_t2"
*.hostR7.udpApp[0].initialProtocol = "Mpr_t2"

#*.hostR8.udpApp[0].initialProtocol = "TimeBasedFlooding"
#*.hostR9.udpApp[0].initialProtocol = "TimeBasedFlooding"
#*.hostR10.udpApp[0].initialProtocol = "TimeBasedFlooding"
#*.hostR11.udpApp[0].initialProtocol = "TimeBasedFlooding"

*.hostR8.udpApp[0].initialProtocol = "Flooding2"
*.hostR9.udpApp[0].initialProtocol = "Flooding2"
*.hostR10.udpApp[0].initialProtocol = "Flooding2"
*.hostR11.udpApp[0].initialProtocol = "Flooding2"

