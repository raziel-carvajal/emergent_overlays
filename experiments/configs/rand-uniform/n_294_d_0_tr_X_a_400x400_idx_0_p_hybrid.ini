[General]
**.arpType = "GlobalARP"
###
*.host*.energyStorageType = "IdealEnergyStorage"
###
*.host*.wlan[0].radio.energyConsumerType = "StateBasedEnergyConsumer"
*.host*.wlan[*].radio.transmitter.maxCommunicationRange = 60m
*.host*.wlan[*].radio.receiver.ignoreInterference = true
###
*.host*.mobilityType = "LinearMobility"
*.host*.mobility.isMoving = false

###
# this lovely and unknown line is the one enabling broadcast in IPv4.
#We need this feature in order to simulate sending simultaneasly to
#many nodes in wireless networks
*.host*.networkLayer.ip.forceBroadcast = true
###
#*.host*.wlan[0].typename = "IdealWirelessNic"
#*.host*.wlan[0].mac.useAck = false
#*.host*.wlan[0].mac.fullDuplex = false

*.host*.wlan[0].typename = "WirelessNic"
*.host*.wlan[*].macType = "CSMA"
*.host*.wlan[*].mac.useMACAcks = true

*.host*.wlan[0].radioType = "IdealRadio"
###
*.host*.numUdpApps = 1
**.bitrate = 1Mbps
###
sim-time-limit = 58s
repeat=1
###
[Config n_294_d_0_tr_X_a_400x400_idx_0_p_hybrid]
network = rand_uniform_topologies.n_294_d_0_tr_X_a_400x400_idx_0_p_

*.host*.udpApp[0].typename = "FullyAdaptive"
*.host*.udpApp[0].protocolsConfig = xmldoc("../../experiments/configs/config.xml")
*.host*.udpApp[0].withAdaptation = true
*.host*.udpApp[0].optimize_gluing = true

*.host*.udpApp[0].nr_broadcast_msg = 500
*.host*.udpApp[0].intervalBroadcastTime = 0.1s
*.host*.udpApp[0].deltaApprox = 0.05s
*.host*.udpApp[0].wakeUpTime = 3.0s

*.hostR280.udpApp[0].is_source = true

