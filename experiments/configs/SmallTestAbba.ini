[General]
**.arpType = "GlobalARP"
###
#*.host*.energyStorageType = "SimpleEnergyStorage"
*.host*.energyStorageType = "IdealEnergyStorage"
###
*.host*.wlan[0].radio.energyConsumerType = "StateBasedEnergyConsumer"
#*.host*.wlan[0].radio.energyConsumer.offPowerConsumption = 0mW
#*.host*.wlan[0].radio.energyConsumer.sleepPowerConsumption = 0mW
#*.host*.wlan[0].radio.energyConsumer.switchingPowerConsumption = 0mW
#*.host*.wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 0mW
#*.host*.wlan[0].radio.energyConsumer.receiverBusyPowerConsumption = 0mW
#*.host*.wlan[0].radio.energyConsumer.receiverReceivingPowerConsumption = 100mW
#*.host*.wlan[0].radio.energyConsumer transmitterIdlePowerConsumption = 0mW
#*.host*.wlan[0].radio.energyConsumer.transmitterTransmittingPowerConsumption = 100mW
*.host*.wlan[*].radio.transmitter.maxCommunicationRange = 75m
*.host*.wlan[*].radio.receiver.ignoreInterference = true
###
#*.host*.wlan[*].radioType = "EnergyAwareIdealRadio"
*.host*.mobilityType = "LinearMobility"
###
# this lovely and unknown line is the one enabling broadcast in IPv4.
#We need this feature in order to simulate sending simultaneasly to
#many nodes in wireless networks
*.host*.networkLayer.ip.forceBroadcast = true
###
*.host*.wlan[0].typename = "IdealWirelessNic"
#*.host*.wlan[0].typename = "WirelessNic"
#*.host*.wlan[0].radioType = "IdealRadio"
*.host*.wlan[*].macType = "CSMA"
# We need MAC acknowledgements to detect if a link is broken between two nodes
*.host*.wlan[*].mac.useMACAcks = true
###
*.host*.numUdpApps = 1
**.bitrate = 1Mbps
###
sim-time-limit =  15s
repeat=1
###
[Config SmallTestAbba]
description = "Broadcasting messages using Abba2"
network = Small
*.host*.udpApp[0].typename = "Abba2"
*.host*.udpApp[0].intervalBroadcastTime = 3s
*.host*.udpApp[0].nr_hello_messages = 0
*.host*.udpApp[0].helloTime = 0
*.hostR1.udpApp[0].is_source = true
*.hostR1.udpApp[0].nr_broadcast_msg = 3
*.hostR1.udpApp[0].wakeUpTime = 6s
*.host*.energyStorage.nominalCapacity = 50J
