[General]
# status
**.hasStatus = true
**.networkLayer.ip.forceBroadcast = true

**.energyStorage.nominalCapacity = 100J
**.energyStorage.nodeShutdownCapacity = 0J
**.energyStorage.initialCapacity = this.nominalCapacity

# Radio settings
**.wlan[*].radio.transmitter.maxCommunicationRange = 75m
**.wlan[*].radio.receiver.ignoreInterference = true
sim-time-limit = 500s
**.numUdpApps = 1
###
[Config n_81_d_0_tr_75_a_700x700_idx_0_p_mpr]
network = hand_made_topologies.SmallNetwork_1PoI_Medium_Density

**.udpApp[0].typename = "MPR"

**.udpApp[0].messageLength = 200B
**.udpApp[0].startTime = 0s
**.udpApp[0].stopTime = 500.0s
**.udpApp[0].sendInterval = uniform(0.4s, 0.5s)
*.host1.udpApp[0].isSource = true
**.udpApp[0].ctrlMsgInterval = uniform(600.0s, 601.0s)
